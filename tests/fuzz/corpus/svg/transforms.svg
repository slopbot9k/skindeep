<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="2in" viewBox="0 0 100 100">
 <style type="text/css"><![CDATA[
  .a { fill: #e33; stroke: #300 }
  .b { fill: none; stroke: #33e; stroke-width: 3px; opacity: .7 }
 ]]></style>
 <g transform="translate(50 50) rotate(30) scale(1.5 0.75)">
  <rect class="a" x="-20" y="-10" width="40" height="20"/>
  <g transform="skewX(20) skewY(-10)">
   <circle class="b" r="12"/>
   <g transform="matrix(0.5 0.2 -0.2 0.5 5 5)" display="none"><rect width="10" height="10"/></g>
   <g transform="matrix(0.5, 0.2, -0.2, 0.5, 5, 5)" visibility="visible"><rect width="10" height="10" fill-opacity="0.3"/></g>
  </g>
 </g>
 <g opacity="0.5" fill="currentColor" color="#09f"><rect x="5" y="80" width="90" height="15" transform="rotate(-5 50 87)"/></g>
 <rect x="0" y="0" width="1cm" height="10pt" fill="#000"/>
</svg>
